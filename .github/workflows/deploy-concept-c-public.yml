name: Deploy concept-c-public to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/deploy-concept-c-public
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/assets/ax-education _site/assets/public-icons
          cp -R concept-c-public _site/
          cp assets/ax-education/hero-loop.webm _site/assets/ax-education/
          cp assets/ax-education/hero-loop.mp4 _site/assets/ax-education/
          cp assets/ax-education/hero-poster.webp _site/assets/ax-education/
          cp assets/public-icons/*.png _site/assets/public-icons/
          touch _site/.nojekyll
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="ko">' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
            '  <title>AX 및 DX 실전 교육 안내</title>' \
            '  <meta http-equiv="refresh" content="0; url=./concept-c-public/">' \
            '</head>' \
            '<body>' \
            '  <a href="./concept-c-public/">AX 및 DX 실전 교육 안내</a>' \
            '  <script>location.replace("./concept-c-public/" + location.search + location.hash);</script>' \
            '</body>' \
            '</html>' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
