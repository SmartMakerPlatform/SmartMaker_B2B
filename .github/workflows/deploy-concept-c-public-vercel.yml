name: Deploy concept-c-public to Vercel

on:
  push:
    branches:
      - main
      - codex/deploy-concept-c-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID"; exit 1; }

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/assets/ax-education _site/assets/public-icons
          cp -R concept-c-public _site/
          cp assets/ax-education/hero-loop.webm _site/assets/ax-education/
          cp assets/ax-education/hero-loop.mp4 _site/assets/ax-education/
          cp assets/ax-education/hero-poster.webp _site/assets/ax-education/
          cp assets/public-icons/*.png _site/assets/public-icons/
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="ko">' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
            '  <title>AX 및 DX 실전 교육 안내</title>' \
            '  <meta http-equiv="refresh" content="0; url=./concept-c-public/">' \
            '</head>' \
            '<body>' \
            '  <a href="./concept-c-public/">AX 및 DX 실전 교육 안내</a>' \
            '  <script>location.replace("./concept-c-public/" + location.search + location.hash);</script>' \
            '</body>' \
            '</html>' > _site/index.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            vercel pull --yes --environment=production --cwd=_site --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --cwd=_site --token="$VERCEL_TOKEN"
          fi

      - name: Build deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            vercel build --prod --cwd=_site --token="$VERCEL_TOKEN"
          else
            vercel build --cwd=_site --token="$VERCEL_TOKEN"
          fi

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            url="$(vercel deploy --prebuilt --prod --cwd=_site --token="$VERCEL_TOKEN")"
          else
            url="$(vercel deploy --prebuilt --cwd=_site --token="$VERCEL_TOKEN")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
